[font]
normal= {family= "JetBrains Mono", style = "Regular"}
size= 15

[scrolling]
history = 10000
multiplier = 3

[window.dimensions]
columns = 109
lines = 29

[window.padding]
x = 0
y = 0

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
background = '#282c34'
foreground = '#abb2bf'

[colors.normal]
black   = '#282c34'
red     = '#e06c75'
green   = '#98c379'
yellow  = '#e5c07b'
blue    = '#61afef'
magenta = '#c678dd'
cyan    = '#56b6c2'
white   = '#abb2bf'

[colors.bright]
black   = '#5c6370'
red     = '#e06c75'
green   = '#98c379'
yellow  = '#e5c07b'
blue    = '#61afef'
magenta = '#c678dd'
cyan    = '#56b6c2'
white   = '#ffffff'


[window]
opacity = 0.95
